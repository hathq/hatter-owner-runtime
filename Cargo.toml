# Hatter downstream, 2026: process policy and exact volatile owner observations.
[package]
name = "hatter-owner-runtime"
version = "0.10.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "Hatter exact process incarnation, handshake and availability policy"
publish = ["ecosystem-private"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md"]

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hatter-owner-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
crowsi-process-adapter = { version = "=0.10.0", registry = "ecosystem-private" }
crowsi-transport-foundation = { version = "=0.10.0", registry = "ecosystem-private", features = ["async-io"] }
tokio = { version = "1.49", features = ["macros", "rt", "time", "io-util", "io-std", "sync"] }
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
