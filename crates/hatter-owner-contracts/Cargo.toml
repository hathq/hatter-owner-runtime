# Hatter downstream, 2026: exact owner identities and observations, no process mechanism.
[package]
readme = "README.md"
repository = "https://github.com/hathq/hatter-owner-runtime"
name = "hatter-owner-contracts"
version = "0.10.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "Exact Hatter owner incarnation and volatile availability contracts"
publish = ["crates-io"]
include = ["src/**", "docs/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"

[lints.rust]
unsafe_code = "forbid"
