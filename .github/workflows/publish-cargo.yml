name: Release Cargo crate from version tag
on:
  push:
    tags: ['v*', 'cargo/**']
  pull_request:
    paths: ['.github/registry-release.json', '.github/scripts/release_plan.py', '.github/scripts/test_release_plan.py', '.github/scripts/archive_binding.py', '.github/scripts/test_archive_binding.py', '.github/workflows/publish-cargo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cargo-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 .github/scripts/test_release_plan.py
          python3 .github/scripts/test_archive_binding.py
  prepare:
    if: github.event_name != 'pull_request' && github.ref_type == 'tag' && github.event.repository.private == false
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-name: ${{ steps.archive.outputs.archive-name }}
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact tag and successful default-branch CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_plan.py cargo
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal
      - name: Build independent archive without publication identity
        env:
          PACKAGE_MANIFEST: ${{ steps.plan.outputs.manifest }}
          PACKAGE_NAME: ${{ steps.plan.outputs.name }}
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          cargo +1.97 package --manifest-path "$PACKAGE_MANIFEST" --locked --all-features --registry crates-io
          cargo +1.97 metadata --manifest-path "$PACKAGE_MANIFEST" --locked --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-release-metadata.json"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          metadata = json.loads(Path(os.environ['RUNNER_TEMP'], 'cargo-release-metadata.json').read_text())
          source = Path(metadata['target_directory'], 'package', os.environ['PACKAGE_NAME'] + '-' + os.environ['PACKAGE_VERSION'] + '.crate')
          destination = Path(os.environ['RUNNER_TEMP'], 'cargo-release')
          destination.mkdir()
          shutil.copyfile(source, destination / source.name)
          PY
      - name: Bind archive identity and digest
        id: archive
        run: python3 .github/scripts/archive_binding.py prepare cargo "$RUNNER_TEMP/cargo-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: cargo-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    if: vars.REGISTRY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io-public
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/cargo-release
      - name: Verify archive and reproducible local package
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
          PACKAGE_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive-name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/archive_binding.py verify cargo "$RUNNER_TEMP/cargo-release"
          cargo +1.97 package --manifest-path "$PACKAGE_MANIFEST" --locked --all-features --registry crates-io
          cargo +1.97 metadata --manifest-path "$PACKAGE_MANIFEST" --locked --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-release-metadata.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          metadata = json.loads(Path(os.environ['RUNNER_TEMP'], 'cargo-release-metadata.json').read_text())
          archive = Path(metadata['target_directory'], 'package', os.environ['ARCHIVE_NAME'])
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_ARCHIVE_SHA256']:
              raise ValueError('Rebuilt package bytes differ from verified artifact')
          PY
      - name: Obtain a short-lived crates.io token through OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish selected crate and verify official checksum
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: |
          cargo +1.97 publish --manifest-path "$PACKAGE_MANIFEST" --locked --all-features --registry crates-io
          python3 .github/scripts/archive_binding.py registry cargo "$RUNNER_TEMP/cargo-release"
          cat "$RUNNER_TEMP/cargo-release/release-receipt.json" >> "$GITHUB_STEP_SUMMARY"
